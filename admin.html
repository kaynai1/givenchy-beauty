<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIVENCHY BEAUTY - 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Maven Pro',sans-serif;background:#f5f5f5;color:#333}
.header{background:#000;color:#fff;padding:16px 30px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:16px;letter-spacing:2px;text-transform:uppercase}
.header a{color:#fff;font-size:12px;text-decoration:underline}
.container{max-width:900px;margin:20px auto;padding:0 20px}
.card{background:#fff;border:1px solid #e0e0e0;padding:24px;margin-bottom:20px}
.card h2{font-size:14px;text-transform:uppercase;letter-spacing:2px;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #eee}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;color:#666}
.field input,.field textarea{width:100%;padding:10px;border:1px solid #ddd;font-family:'Maven Pro';font-size:14px;transition:border .2s}
.field input:focus,.field textarea:focus{outline:none;border-color:#000}
.field textarea{min-height:80px;resize:vertical}
.field-hint{font-size:11px;color:#999;margin-top:4px}
.btn{padding:10px 24px;border:none;font-family:'Maven Pro';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;cursor:pointer;transition:all .2s}
.btn-primary{background:#000;color:#fff}
.btn-primary:hover{background:#333}
.btn-row{display:flex;gap:10px;margin-top:20px}
.toast{position:fixed;top:20px;right:20px;background:#000;color:#fff;padding:12px 20px;font-size:12px;letter-spacing:1px;opacity:0;transition:opacity .3s;z-index:999}
.toast.show{opacity:1}
.product-item{border:1px solid #eee;padding:16px;margin-bottom:12px;position:relative}
.product-item .remove-btn{position:absolute;top:8px;right:8px;background:none;border:none;font-size:18px;cursor:pointer;color:#999}
.product-item .remove-btn:hover{color:#c00}
.preview-link{display:inline-block;margin-top:8px;font-size:12px;text-decoration:underline}
.img-preview{max-width:200px;max-height:100px;margin-top:8px;border:1px solid #eee}
</style>
</head>
<body>

<div class="header">
  <h1>GIVENCHY BEAUTY 后台管理</h1>
  <a href="index-v3.html" target="_blank">预览网站 →</a>
</div>

<div class="container">
  <!-- HERO -->
  <div class="card">
    <h2>🖼️ Hero Banner</h2>
    <div class="field">
      <label>标题</label>
      <input type="text" id="heroTitle" placeholder="L'INTERDIT 心无禁忌">
    </div>
    <div class="field">
      <label>副标题</label>
      <input type="text" id="heroTag" placeholder="新品上市">
    </div>
    <div class="field">
      <label>描述</label>
      <textarea id="heroDesc" placeholder="黑白橙花交织，释放独特迷人魅力"></textarea>
    </div>
    <div class="field">
      <label>按钮文字</label>
      <input type="text" id="heroBtn" placeholder="探索更多">
    </div>
    <div class="field">
      <label>图片URL</label>
      <input type="text" id="heroImg" placeholder="https://...">
      <div class="field-hint">粘贴图片链接地址</div>
    </div>
  </div>

  <!-- PRODUCTS -->
  <div class="card">
    <h2>🛍️ 产品管理</h2>
    <div id="productsList"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="addProduct()">+ 添加产品</button>
    </div>
  </div>

  <!-- NEWSLETTER -->
  <div class="card">
    <h2>📧 订阅设置</h2>
    <div class="field">
      <label>标题</label>
      <input type="text" id="nlTitle" placeholder="订阅纪梵希">
    </div>
    <div class="field">
      <label>描述</label>
      <input type="text" id="nlDesc" placeholder="第一时间获取新品资讯与美妆灵感">
    </div>
  </div>

  <!-- FOOTER -->
  <div class="card">
    <h2>📋 Footer 设置</h2>
    <div class="field">
      <label>客服电话</label>
      <input type="text" id="footerPhone" placeholder="400 920 1177">
    </div>
    <div class="field">
      <label>版权信息</label>
      <input type="text" id="footerCopy" placeholder="© 2026 GIVENCHY BEAUTY">
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="saveAll()">💾 保存所有更改</button>
    <button class="btn" style="border:1px solid #ddd" onclick="exportData()">📤 导出数据</button>
    <button class="btn" style="border:1px solid #ddd" onclick="importData()">📥 导入数据</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" style="display:none" accept=".json">

<script>
// Default data
const defaultData = {
  heroTitle: "L'INTERDIT 心无禁忌",
  heroTag: "新品上市",
  heroDesc: "黑白橙花交织\n释放独特迷人魅力",
  heroBtn: "探索更多",
  heroImg: "https://www.givenchybeauty.cn/on/demandware.static/-/Library-Sites-GivenchySharedLibrary/default/dwbe9f0c17/LATEST/2024/FRAG/LCP_Coeur-Fou_Latest_Desktop.jpg",
  products: [
    {name:"L'INTERDIT 心无禁忌",sub:"女士淡香精 50ML",price:"¥1,120",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dw67a86ab8/images/P069001/3274872372146_P069001_L_INTERDIT-EDP-50ML_0.png"},
    {name:"INTERDIT ROUGE",sub:"心无禁忌迷红香水",price:"¥1,280",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dwbaa40abc/images/P069262/interdit_rouge.png"},
    {name:"GENTLEMEN SOCIETY",sub:"绅士浓情淡香精 50ML",price:"¥980",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dw4cf4d211/images/P011050/3274872399013_P011050_GG_EDPB_79_6_50ML_a_0.png"},
    {name:"PRISME LIBRE",sub:"暗皮救星粉底液 30ML",price:"¥520",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dw17f632f4/images/P090721/3274872413627_P090721_PL-FDT-30ML-1-N80_0.png"},
    {name:"TEINT COUTURE",sub:"明星柔雾粉底液 30ML",price:"¥480",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dwf5d5fd77/images/P090401/3274872430921_P090401_PL-FDT-MATTE-30ML-1-N80_0.png"},
    {name:"LE ROUGE INTERDIT",sub:"高定禁忌唇膏 3.4G",price:"¥320",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dwade722fe/images/P084773/3274872442924_P084773_LE-ROUGE-INTE-INT-SILK-3,4G-N326_0.png"}
  ],
  nlTitle: "订阅纪梵希",
  nlDesc: "第一时间获取新品资讯与美妆灵感",
  footerPhone: "400 920 1177",
  footerCopy: "© 2026 GIVENCHY BEAUTY. All Rights Reserved."
};

let data = JSON.parse(localStorage.getItem('givenchyData') || 'null') || JSON.parse(JSON.stringify(defaultData));

function loadForm() {
  document.getElementById('heroTitle').value = data.heroTitle;
  document.getElementById('heroTag').value = data.heroTag;
  document.getElementById('heroDesc').value = data.heroDesc;
  document.getElementById('heroBtn').value = data.heroBtn;
  document.getElementById('heroImg').value = data.heroImg;
  document.getElementById('nlTitle').value = data.nlTitle;
  document.getElementById('nlDesc').value = data.nlDesc;
  document.getElementById('footerPhone').value = data.footerPhone;
  document.getElementById('footerCopy').value = data.footerCopy;
  renderProducts();
}

function renderProducts() {
  const list = document.getElementById('productsList');
  list.innerHTML = data.products.map((p, i) => `
    <div class="product-item">
      <button class="remove-btn" onclick="removeProduct(${i})">×</button>
      <div class="field"><label>产品名称</label><input type="text" value="${p.name}" onchange="data.products[${i}].name=this.value"></div>
      <div class="field"><label>产品描述</label><input type="text" value="${p.sub}" onchange="data.products[${i}].sub=this.value"></div>
      <div class="field"><label>价格</label><input type="text" value="${p.price}" onchange="data.products[${i}].price=this.value"></div>
      <div class="field"><label>图片URL</label><input type="text" value="${p.img}" onchange="data.products[${i}].img=this.value">
        ${p.img ? `<img src="${p.img}" class="img-preview" onerror="this.style.display='none'">` : ''}
      </div>
    </div>
  `).join('');
}

function addProduct() {
  data.products.push({name:"新产品",sub:"产品描述",price:"¥0",img:""});
  renderProducts();
}

function removeProduct(i) {
  if(confirm('确定删除这个产品？')) {
    data.products.splice(i, 1);
    renderProducts();
  }
}

function saveAll() {
  data.heroTitle = document.getElementById('heroTitle').value;
  data.heroTag = document.getElementById('heroTag').value;
  data.heroDesc = document.getElementById('heroDesc').value;
  data.heroBtn = document.getElementById('heroBtn').value;
  data.heroImg = document.getElementById('heroImg').value;
  data.nlTitle = document.getElementById('nlTitle').value;
  data.nlDesc = document.getElementById('nlDesc').value;
  data.footerPhone = document.getElementById('footerPhone').value;
  data.footerCopy = document.getElementById('footerCopy').value;
  
  localStorage.setItem('givenchyData', JSON.stringify(data));
  showToast('✅ 保存成功！');
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'givenchy-data.json';
  a.click();
}

function importData() {
  document.getElementById('importFile').click();
}

document.getElementById('importFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      data = JSON.parse(ev.target.result);
      localStorage.setItem('givenchyData', JSON.stringify(data));
      loadForm();
      showToast('✅ 导入成功！');
    } catch(e) { alert('文件格式错误'); }
  };
  reader.readAsText(file);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

loadForm();
</script>
</body>
</html>
