<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIVENCHY CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f9fc;--card:#fff;--border:#e5e7eb;--text:#111827;--text2:#6b7280;--text3:#9ca3af;--accent:#6366f1;--accent2:#4f46e5;--success:#10b981;--danger:#ef4444;--radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* Layout */
.app{display:flex;height:100vh}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:8px 12px 16px;border-bottom:1px solid var(--border);margin-bottom:12px;color:var(--accent)}
.sb-nav{flex:1;overflow-y:auto}
.ni{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.ni:hover{background:#f3f4f6;color:var(--text)}.ni.active{background:var(--accent);color:#fff}
.sb-foot{padding-top:10px;border-top:1px solid var(--border)}
.sb-foot a{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:11px;color:var(--text3)}
.sb-foot a:hover{color:var(--accent)}
/* Main */
.main-area{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:rgba(248,249,252,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700}
.topbar-right{display:flex;gap:8px}
.btn{padding:8px 16px;border:none;border-radius:10px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent2)}
.btn-g{background:var(--success);color:#fff}.btn-g:hover{background:#059669}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
/* Content area split */
.content-area{flex:1;display:flex;overflow:hidden}
.editor-pane{flex:1;overflow-y:auto;padding:20px}
.preview-pane{width:45%;border-left:1px solid var(--border);background:#fff;overflow-y:auto;flex-shrink:0}
.preview-pane iframe{width:100%;height:100%;border:none}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ct{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:#eef2ff;color:var(--accent)}
/* Form */
.fg{margin-bottom:14px}.fl{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:5px}
.fi{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:12px;color:var(--text);background:var(--bg);transition:all .15s}
.fi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.08);background:#fff}
textarea.fi{min-height:60px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Upload */
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.upload-area:hover,.upload-area.drag{border-color:var(--accent);background:#f5f3ff}
.upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-icon{font-size:28px;margin-bottom:6px}
.upload-text{font-size:11px;color:var(--text3)}
.upload-preview{max-width:100%;max-height:120px;border-radius:8px;margin-top:8px;display:none}
/* Item cards */
.ic{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.ic .rm{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:none;background:#fee2e2;color:var(--danger);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ic .rm:hover{background:var(--danger);color:#fff}
.ic-grid{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:start}
.ic-thumb{width:60px;height:60px;border-radius:8px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ic-thumb img{max-width:60%;max-height:60%;object-fit:contain}
.ic-fields{display:flex;flex-direction:column;gap:5px}
.ic-fields .fi{padding:6px 9px;font-size:11px}
/* Tab */
.tab{display:none}.tab.active{display:block}
/* Toast */
.toast{position:fixed;top:20px;right:20px;padding:10px 18px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;z-index:999;opacity:0;transform:translateY(-8px);transition:all .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.toast.show{opacity:1;transform:translateY(0)}.toast-s{background:var(--success)}.toast-e{background:var(--danger)}.toast-w{background:#f59e0b}
/* Progress */
.progress{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0}
/* Link items */
.li{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
.li:last-child{border:none}.li input{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:11px}
.li .rl{width:22px;height:22px;border-radius:50%;border:none;background:#fee2e2;color:var(--danger);font-size:12px;cursor:pointer;flex-shrink:0}
/* Responsive */
@media(max-width:900px){
  .sidebar{display:none}.app{flex-direction:column}
  .content-area{flex-direction:column}
  .preview-pane{width:100%;height:40vh;border-left:none;border-top:1px solid var(--border)}
  .frow{grid-template-columns:1fr}
  .ic-grid{grid-template-columns:1fr}
  .ic-thumb{width:100%;height:60px}
}
@media(max-width:500px){
  .topbar{padding:10px 14px}.editor-pane{padding:12px}
}
</style>
</head>
<body>

        <div id="pL"></div>

      <!-- Latest -->
      <div class="tab" id="t-latest">

        <div class="fg"><label class="fl">板块标题</label><input class="fi" id="iLTitle" oninput="upd()"></div>
        <div id="latL"></div>
        <div style="text-align:center;padding:12px"><button class="btn btn-ghost" onclick="addLat()">+ 添加</button></div></div>
      </div>
      <!-- Maison -->
      <div class="tab" id="t-maison">
        <div class="card"><div class="ch"><div class="ct">🏛️ 品牌故事</div></div>
        <div class="frow">
          <div class="fg"><label class="fl">小标题</label><input class="fi" id="iMSub" oninput="upd()"></div>
          <div class="fg"><label class="fl">大标题</label><input class="fi" id="iMTitle" oninput="upd()"></div>
        </div>
        <div id="maiL"></div>
        <div style="text-align:center;padding:12px"><button class="btn btn-ghost" onclick="addMai()">+ 添加</button></div></div>
      </div>
      <!-- Newsletter -->
      <div class="tab" id="t-nl">
        <div class="card"><div class="ch"><div class="ct">📧 邮件订阅</div></div>
        <div class="fg"><label class="fl">标题</label><input class="fi" id="iNLTitle" oninput="upd()"></div>
        <div class="fg"><label class="fl">描述</label><input class="fi" id="iNLDesc" oninput="upd()"></div></div>
      </div>
      <!-- Footer -->
      <div class="tab" id="t-footer">
        <div class="card"><div class="ch"><div class="ct">📋 Footer</div></div>
        <div class="frow">
          <div class="fg"><label class="fl">电话</label><input class="fi" id="iFPhone" oninput="upd()"></div>
          <div class="fg"><label class="fl">版权</label><input class="fi" id="iFCopy" oninput="upd()"></div>
        </div></div>
      </div>
    </div>
    <div class="preview-pane">
      <iframe id="preview" src="index.html"></iframe>
    </div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="impFile" style="display:none" accept=".json">

function upImg(fileInput,targetInput,previewId){

  };
  reader.readAsDataURL(file);

function pub(){
  save();
  if(!GH){var tk=prompt('首次使用请输入GitHub Token：');if(!tk)return;GH=tk;localStorage.setItem('ghToken',tk);toast('Token已记住','s');}
  toast('🚀 正在发布...','w');
  fetch('https://api.github.com/repos/kaynai1/givenchy-beauty/contents/index.html',{headers:{'Authorization':'token '+GH}})
  .then(function(r){return r.json()}).then(function(f){
    fetch('index.html').then(function(r){return r.text()}).then(function(html){
      var ds=JSON.stringify(data,null,2);
      var nh=html.replace(/var CONFIG=\{[\s\S]*?\n\};/,'var CONFIG='+ds+';');
      fetch('https://api.github.com/repos/kaynai1/givenchy-beauty/contents/index.html',{method:'PUT',headers:{'Authorization':'token '+GH,'Content-Type':'application/json'},body:JSON.stringify({message:'CMS update',content:btoa(unescape(encodeURIComponent(nh))),sha:f.sha})})
      .then(function(r){return r.json()}).then(function(d){if(d.content)toast('✅ 发布成功!','s');else toast('❌ '+d.message,'e');})
      .catch(function(){toast('❌ 网络错误','e');});

}
