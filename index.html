*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--black:#000;--white:#fff;--border:#cecece;--gray:#757575;--bg:#f6f6f6;--max-w:1122px}
html{scroll-behavior:smooth}
body{font-family:'Maven Pro',sans-serif;font-size:14px;color:var(--black);line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
ul{list-style:none}
.giv-header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--white);border-bottom:1px solid var(--border);transition:box-shadow .3s}
.giv-header.scrolled{box-shadow:0 2px 20px rgba(0,0,0,.06)}
.giv-header-container{max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;height:64px}
.giv-header-left{display:flex;align-items:center;gap:16px}
.giv-header-center{position:absolute;left:50%;transform:translateX(-50%)}
.giv-header-logo{height:20px;display:block}
.giv-header-right{display:flex;align-items:center;gap:20px}
.giv-header-icon{width:18px;height:18px;cursor:pointer;opacity:.6;transition:opacity .3s}
.giv-header-icon:hover{opacity:1}
.menu-btn{display:flex;flex-direction:column;gap:4px;cursor:pointer;border:none;background:none;padding:4px}
.menu-btn span{width:18px;height:1.5px;background:var(--black);transition:.3s}
.giv-nav{display:none}
@media(min-width:800px){
  .giv-nav{display:block;border-bottom:1px solid var(--border);background:var(--white)}
  .giv-nav-inner{max-width:var(--max-w);margin:0 auto;display:flex;justify-content:center;gap:40px;padding:0 20px}
  .giv-nav a{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:500;padding:14px 0;display:block;position:relative}
  .giv-nav a:after{content:'';position:absolute;bottom:0;left:0;width:0;height:3px;background:var(--black);transition:width .3s}
  .giv-nav a:hover:after{width:100%}
  .menu-btn{display:none}
  .giv-header-container{height:auto;padding:20px 20px 14px}
}
.hero{position:relative;width:100%;height:auto;aspect-ratio:16/7;min-height:300px;overflow:hidden;margin-top:64px}
@media(min-width:800px){.hero{aspect-ratio:16/6;margin-top:0}}
.hero-img{width:100%;height:100%;object-fit:cover;object-position:center}
.hero-content{position:absolute;bottom:60px;left:40px;z-index:2;max-width:400px}
@media(max-width:800px){.hero-content{left:20px;bottom:40px;max-width:260px}}
.hero-tag{display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--white);margin-bottom:8px;font-weight:500}
.hero-title{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:clamp(24px,4vw,40px);text-transform:uppercase;letter-spacing:4px;color:var(--white);line-height:1.1;margin-bottom:12px}
.hero-desc{font-size:13px;color:var(--white);line-height:1.6;letter-spacing:.5px;margin-bottom:20px;opacity:.9}
.btn-primary{display:inline-block;padding:11px 32px;background:var(--black);color:var(--white);border:1px solid var(--black);font-family:'Roboto Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:all .3s}
.btn-primary:hover{background:var(--white);color:var(--black)}
.quick-access{border-bottom:1px solid var(--border);padding:0}
.quick-access-scroll{max-width:var(--max-w);margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:24px 20px;gap:0}
.quick-access-scroll::-webkit-scrollbar{display:none}
.qa-item{flex:0 0 calc(100%/6);min-width:100px;text-align:center;padding:0 8px}
@media(max-width:800px){.qa-item{flex:0 0 100px;min-width:90px;padding:0 6px}}
.qa-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;margin:0 auto 8px}
.qa-label{font-size:11px;font-weight:400}
.featured{border-bottom:1px solid var(--border);padding:60px 0}
.featured-title{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:36px}
.products-scroll{display:flex;overflow-x:auto;scrollbar-width:none;gap:0;padding:0 20px;-ms-overflow-style:none}
.products-scroll::-webkit-scrollbar{display:none}
.prod-card{flex:0 0 200px;padding:0 15px;text-align:center}
@media(min-width:800px){.prod-card{flex:0 0 calc(var(--max-w)/6 - 2px)}}
.prod-img-wrap{background:var(--bg);padding:16px;margin-bottom:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.prod-img-wrap img{max-height:75%;max-width:75%;object-fit:contain}
.prod-name{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;line-height:1.3;margin-bottom:4px}
.prod-sub{font-size:11px;color:var(--gray);letter-spacing:.3px;margin-bottom:4px}
.prod-price{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.5px}
.content-tiles{max-width:var(--max-w);margin:0 auto;padding:60px 20px}
.content-tiles-title{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:36px}
.content-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:30px}
@media(max-width:800px){.content-grid{grid-template-columns:1fr;gap:20px}}
.content-card{position:relative;overflow:hidden;cursor:pointer}
.content-card-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform .6s}
.content-card:hover .content-card-img{transform:scale(1.03)}
.content-card-title{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-top:12px}
.maison{background:var(--black);padding:60px 0;margin:60px 0 0}
.maison-inner{max-width:var(--max-w);margin:0 auto;padding:0 20px}
.maison-header{text-align:center;margin-bottom:36px}
.maison-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:6px}
.maison-title{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--white)}
.maison-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
@media(max-width:800px){.maison-grid{grid-template-columns:1fr;gap:20px}}
.maison-card{text-align:center}
.maison-card-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;margin-bottom:12px}
.maison-card-title{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--white)}
.maison-card-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.newsletter{padding:60px 20px;text-align:center;border-top:1px solid var(--border)}
.newsletter h2{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
.newsletter p{font-size:12px;color:var(--gray);letter-spacing:.5px;margin-bottom:24px}
.nl-form{display:flex;max-width:440px;margin:0 auto;border:1px solid var(--black)}
.nl-form input{flex:1;padding:12px 16px;border:none;outline:none;font-family:'Maven Pro';font-size:13px;background:transparent}
.nl-form button{padding:12px 24px;background:var(--black);color:var(--white);border:none;font-family:'Roboto Condensed';font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;cursor:pointer;transition:background .3s}
.nl-form button:hover{background:var(--gray)}
.footer{background:var(--black);color:var(--white);padding:60px 0 20px}
.footer-grid{max-width:var(--max-w);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:30px;padding:0 20px 40px}
@media(max-width:800px){.footer-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.footer-grid{grid-template-columns:1fr}}
.footer-col h4{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;opacity:.6;margin-bottom:18px}
.footer-col li{margin-bottom:10px}
.footer-col a{font-size:12px;opacity:.45;transition:opacity .3s}
.footer-col a:hover{opacity:1}
.footer-phone{font-family:'Roboto Condensed';font-size:18px;letter-spacing:2px;margin-bottom:16px}
.footer-social{display:flex;gap:14px}
.footer-social svg{opacity:.4;transition:opacity .3s}
.footer-social:hover svg{opacity:1}
.footer-bottom{max-width:var(--max-w);margin:0 auto;border-top:1px solid rgba(255,255,255,.1);padding-top:16px;display:flex;justify-content:space-between;align-items:center;padding-left:20px;padding-right:20px;flex-wrap:wrap;gap:10px}
.footer-copy{font-size:10px;opacity:.25;letter-spacing:1px}
.footer-links{display:flex;gap:20px}
.footer-links a{font-size:10px;opacity:.25;letter-spacing:1px}
.footer-links a:hover{opacity:.5}
@media(max-width:800px){
  .giv-header-container{height:56px;padding:12px 16px}
  .giv-header-logo{height:16px}
  .content-tiles{padding:40px 16px}
  .maison{padding:40px 0;margin-top:40px}
  .featured{padding:40px 0}

</style>

  document.getElementById('nlSection').innerHTML='<h2>'+C.nlTitle+'</h2><p>'+C.nlDesc+'</p><form class="nl-form" onsubmit="event.preventDefault();this.querySelector(\'button\').textContent=\'感谢订阅\';var f=this;setTimeout(function(){f.querySelector(\'button\').textContent=\'订阅\';f.reset()},2000)"><input type="email" placeholder="请输入您的邮箱" required><button type="submit">订阅</button></form>';
  // Footer
  var fl=C.footerLinks;
  document.getElementById('footerSection').innerHTML='<div class="footer-grid"><div class="footer-col"><h4>产品系列</h4><ul>'+fl.products.map(function(l){return '<li><a href="'+l.href+'">'+l.label+'</a></li>';}).join('')+'</ul></div><div class="footer-col"><h4>客户服务</h4><ul>'+fl.service.map(function(l){return '<li><a href="'+l.href+'">'+l.label+'</a></li>';}).join('')+'</ul></div><div class="footer-col"><h4>关于纪梵希</h4><ul>'+fl.about.map(function(l){return '<li><a href="'+l.href+'">'+l.label+'</a></li>';}).join('')+'</ul></div><div class="footer-col"><h4>联系方式</h4><div class="footer-phone">'+C.footerPhone+'</div><div class="footer-social">'+C.social.map(function(s){return '<a href="'+s.url+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg></a>';}).join('')+'</div></div></div><div class="footer-bottom"><span class="footer-copy">'+C.footerCopy+'</span><div class="footer-links"><a href="#">隐私政策</a><a href="#">使用条款</a></div></div>';

  window.addEventListener('scroll',function(){document.getElementById('header').classList.toggle('scrolled',window.scrollY>30)});
})();
