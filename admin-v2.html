<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIVENCHY Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--card:#fff;--border:#eaeaea;--text:#1a1a1a;--text2:#666;--text3:#999;--accent:#6C63FF;--accent2:#4F46E5;--success:#10B981;--danger:#EF4444;--radius:16px;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 20px rgba(0,0,0,.03);--shadow-lg:0 4px 6px rgba(0,0,0,.04),0 10px 40px rgba(0,0,0,.06)}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* Sidebar */
.sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;background:#fff;border-right:1px solid var(--border);padding:24px;display:flex;flex-direction:column;z-index:100}
.sidebar-logo{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text);padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:24px}
.sidebar-nav{flex:1}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text2);transition:all .2s;margin-bottom:4px}
.sidebar-nav a:hover,.sidebar-nav a.active{background:var(--accent);color:#fff}
.sidebar-nav .icon{font-size:18px}
.sidebar-footer{padding-top:16px;border-top:1px solid var(--border)}
.sidebar-footer a{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text3);padding:8px 0;transition:color .2s}
.sidebar-footer a:hover{color:var(--accent)}

/* Main */
.main{margin-left:260px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(250,250,250,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;justify-content:space-between;align-items:center}
.topbar-title{font-size:20px;font-weight:700}
.btn{padding:10px 20px;border:none;border-radius:10px;font-family:'Inter';font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(108,99,255,.3)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.content{padding:32px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:24px;box-shadow:var(--shadow);transition:box-shadow .3s}
.card:hover{box-shadow:var(--shadow-lg)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.card-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.card-title .emoji{font-size:20px}
.card-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:#f0f0ff;color:var(--accent)}

/* Form */
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px}
.form-input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;font-family:'Inter';font-size:14px;color:var(--text);background:var(--bg);transition:all .2s}
.form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.1);background:#fff}
textarea.form-input{min-height:100px;resize:vertical}
.form-hint{font-size:12px;color:var(--text3);margin-top:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Product Cards */
.product-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;position:relative;transition:all .2s}
.product-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(108,99,255,.08)}
.product-card .remove-btn{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:none;background:#fee2e2;color:var(--danger);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.product-card .remove-btn:hover{background:var(--danger);color:#fff}
.product-grid{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.product-thumb{width:80px;height:80px;border-radius:10px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-thumb img{max-width:70%;max-height:70%;object-fit:contain}
.product-fields{display:flex;flex-direction:column;gap:8px}
.product-fields .form-input{padding:8px 12px;font-size:13px}

/* Tab content */
.tab-content{display:none}
.tab-content.active{display:block}

/* Empty state */
.empty{text-align:center;padding:40px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-text{font-size:14px;margin-bottom:16px}

/* Toast */
.toast{position:fixed;top:24px;right:24px;padding:14px 24px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;z-index:999;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.toast.show{opacity:1;transform:translateY(0)}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}

/* Responsive */
@media(max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0}
  .content{padding:20px}
  .topbar{padding:12px 20px}
  .form-row{grid-template-columns:1fr}
  .product-grid{grid-template-columns:1fr}
  .product-thumb{width:100%;height:120px}
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">GIVENCHY ADMIN</div>
  <nav class="sidebar-nav">
    <a href="#" class="active" onclick="switchTab('hero',this)"><span class="icon">🖼️</span> Hero Banner</a>
    <a href="#" onclick="switchTab('products',this)"><span class="icon">🛍️</span> 产品管理</a>
    <a href="#" onclick="switchTab('quickaccess',this)"><span class="icon">⚡</span> 快速入口</a>
    <a href="#" onclick="switchTab('newsletter',this)"><span class="icon">📧</span> 订阅设置</a>
    <a href="#" onclick="switchTab('footer',this)"><span class="icon">📋</span> Footer</a>
  </nav>
  <div class="sidebar-footer">
    <a href="index-v3.html" target="_blank">🌐 预览网站</a>
    <a href="#" onclick="exportData()">📤 导出备份</a>
    <a href="#" onclick="importData()">📥 导入备份</a>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="pageTitle">Hero Banner</div>
    <div>
      <button class="btn btn-primary" onclick="saveAll()">💾 保存更改</button>
    </div>
  </div>

  <div class="content">
    <!-- Hero Tab -->
    <div class="tab-content active" id="tab-hero">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="emoji">🖼️</span> Hero Banner 设置</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">标签文字</label>
            <input class="form-input" id="heroTag" placeholder="新品上市">
          </div>
          <div class="form-group">
            <label class="form-label">按钮文字</label>
            <input class="form-input" id="heroBtn" placeholder="探索更多">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">标题</label>
          <input class="form-input" id="heroTitle" placeholder="L'INTERDIT 心无禁忌">
        </div>
        <div class="form-group">
          <label class="form-label">描述</label>
          <textarea class="form-input" id="heroDesc" placeholder="黑白橙花交织，释放独特迷人魅力"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">背景图片</label>
          <input class="form-input" id="heroImg" placeholder="https://...">
          <div class="form-hint">粘贴图片URL地址</div>
          <div id="heroImgPreview" style="margin-top:12px"></div>
        </div>
      </div>
    </div>

    <!-- Products Tab -->
    <div class="tab-content" id="tab-products">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="emoji">🛍️</span> 产品列表</div>
          <span class="card-badge" id="prodCount">6 个产品</span>
        </div>
        <div id="productsList"></div>
        <div style="text-align:center;padding:20px">
          <button class="btn btn-ghost" onclick="addProduct()">+ 添加新产品</button>
        </div>
      </div>
    </div>

    <!-- Quick Access Tab -->
    <div class="tab-content" id="tab-quickaccess">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="emoji">⚡</span> 快速入口</div>
        </div>
        <div id="qaList"></div>
        <div style="text-align:center;padding:20px">
          <button class="btn btn-ghost" onclick="addQA()">+ 添加入口</button>
        </div>
      </div>
    </div>

    <!-- Newsletter Tab -->
    <div class="tab-content" id="tab-newsletter">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="emoji">📧</span> 邮件订阅</div>
        </div>
        <div class="form-group">
          <label class="form-label">标题</label>
          <input class="form-input" id="nlTitle" placeholder="订阅纪梵希">
        </div>
        <div class="form-group">
          <label class="form-label">描述</label>
          <input class="form-input" id="nlDesc" placeholder="第一时间获取新品资讯与美妆灵感">
        </div>
      </div>
    </div>

    <!-- Footer Tab -->
    <div class="tab-content" id="tab-footer">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="emoji">📋</span> Footer 设置</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">客服电话</label>
            <input class="form-input" id="footerPhone" placeholder="400 920 1177">
          </div>
          <div class="form-group">
            <label class="form-label">版权信息</label>
            <input class="form-input" id="footerCopy" placeholder="© 2026 GIVENCHY BEAUTY">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" style="display:none" accept=".json">

<script>
const defaultData = {
  heroTitle: "L'INTERDIT 心无禁忌",
  heroTag: "新品上市",
  heroDesc: "黑白橙花交织\n释放独特迷人魅力",
  heroBtn: "探索更多",
  heroImg: "https://www.givenchybeauty.cn/on/demandware.static/-/Library-Sites-GivenchySharedLibrary/default/dwbe9f0c17/LATEST/2024/FRAG/LCP_Coeur-Fou_Latest_Desktop.jpg",
  products: [
    {name:"L'INTERDIT 心无禁忌",sub:"女士淡香精 50ML",price:"¥1,120",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dw67a86ab8/images/P069001/3274872372146_P069001_L_INTERDIT-EDP-50ML_0.png"},
    {name:"INTERDIT ROUGE",sub:"心无禁忌迷红香水",price:"¥1,280",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dwbaa40abc/images/P069262/interdit_rouge.png"},
    {name:"GENTLEMEN SOCIETY",sub:"绅士浓情淡香精 50ML",price:"¥980",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dw4cf4d211/images/P011050/3274872399013_P011050_GG_EDPB_79_6_50ML_a_0.png"},
    {name:"PRISME LIBRE",sub:"暗皮救星粉底液 30ML",price:"¥520",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dw17f632f4/images/P090721/3274872413627_P090721_PL-FDT-30ML-1-N80_0.png"},
    {name:"TEINT COUTURE",sub:"明星柔雾粉底液 30ML",price:"¥480",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dwf5d5fd77/images/P090401/3274872430921_P090401_PL-FDT-MATTE-30ML-1-N80_0.png"},
    {name:"LE ROUGE INTERDIT",sub:"高定禁忌唇膏 3.4G",price:"¥320",img:"https://www.givenchybeauty.cn/dw/image/v2/BBZW_PRD/on/demandware.static/-/Sites-givenchy-beauty-master/default/dwade722fe/images/P084773/3274872442924_P084773_LE-ROUGE-INTE-INT-SILK-3,4G-N326_0.png"}
  ],
  qa: [
    {label:"心无禁忌",img:"https://www.givenchybeauty.cn/on/demandware.static/-/Library-Sites-GivenchySharedLibrary/default/dw961fe95f/QuickAccess/2025/FRAG/QUICK_ACCESS_Lenfant_terrible_324x434_180kb.jpg"},
    {label:"禁忌之巅",img:"https://www.givenchybeauty.cn/on/demandware.static/-/Library-Sites-GivenchySharedLibrary/default/dw0c2f4af2/QuickAccess/2025/FRAG/QA_INTERDIT_ABSOLU.jpg"},
    {label:"高定唇妆",img:"https://www.givenchybeauty.cn/on/demandware.static/-/Library-Sites-GivenchySharedLibrary/default/dw9c2119e8/QuickAccess/2025/MAKEUP/GIV_LRI_BAUME_COUTURE_QA.jpg"},
    {label:"护肤系列",img:"https://www.givenchybeauty.cn/on/demandware.static/-/Library-Sites-GivenchySharedLibrary/default/dw88358bd2/QuickAccess/2024/SKINCARE/10_QA_LSN_COLLECTION.jpg"},
    {label:"丝绒唇膏",img:"https://www.givenchybeauty.cn/on/demandware.static/-/Library-Sites-GivenchySharedLibrary/default/dw70601d46/QuickAccess/2024/MUP/LRI-Satin_Quick-Access_KV_Desktop_Mobile.jpeg"},
    {label:"蕾丝面膜",img:"https://www.givenchybeauty.cn/on/demandware.static/-/Library-Sites-GivenchySharedLibrary/default/dw6e209564/LATEST/2024/SKINCARE/LSN_Lace-Face-Mask_Latest_Desktop.jpg"}
  ],
  nlTitle: "订阅纪梵希",
  nlDesc: "第一时间获取新品资讯与美妆灵感",
  footerPhone: "400 920 1177",
  footerCopy: "© 2026 GIVENCHY BEAUTY. All Rights Reserved."
};

let data = JSON.parse(localStorage.getItem('givenchyData') || 'null') || JSON.parse(JSON.stringify(defaultData));

function switchTab(tab, el) {
  event.preventDefault();
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  el.classList.add('active');
  const titles = {hero:'Hero Banner',products:'产品管理',quickaccess:'快速入口',newsletter:'订阅设置',footer:'Footer 设置'};
  document.getElementById('pageTitle').textContent = titles[tab] || tab;
}

function loadForm() {
  document.getElementById('heroTitle').value = data.heroTitle || '';
  document.getElementById('heroTag').value = data.heroTag || '';
  document.getElementById('heroDesc').value = data.heroDesc || '';
  document.getElementById('heroBtn').value = data.heroBtn || '';
  document.getElementById('heroImg').value = data.heroImg || '';
  document.getElementById('nlTitle').value = data.nlTitle || '';
  document.getElementById('nlDesc').value = data.nlDesc || '';
  document.getElementById('footerPhone').value = data.footerPhone || '';
  document.getElementById('footerCopy').value = data.footerCopy || '';
  updateHeroPreview();
  renderProducts();
  renderQA();
}

function updateHeroPreview() {
  const url = document.getElementById('heroImg').value;
  const el = document.getElementById('heroImgPreview');
  el.innerHTML = url ? '<img src="' + url + '" style="max-width:300px;border-radius:10px;border:1px solid var(--border)" onerror="this.style.display=\'none\'">' : '';
}

document.getElementById('heroImg').addEventListener('input', updateHeroPreview);

function renderProducts() {
  document.getElementById('prodCount').textContent = data.products.length + ' 个产品';
  const list = document.getElementById('productsList');
  if (!data.products.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🛍️</div><div class="empty-text">还没有产品</div></div>';
    return;
  }
  list.innerHTML = data.products.map(function(p, i) {
    return '<div class="product-card">' +
      '<button class="remove-btn" onclick="removeProduct(' + i + ')">×</button>' +
      '<div class="product-grid">' +
        '<div class="product-thumb">' + (p.img ? '<img src="' + p.img + '" onerror="this.parentElement.innerHTML=\'🛍️\'">' : '🛍️') + '</div>' +
        '<div class="product-fields">' +
          '<input class="form-input" value="' + esc(p.name) + '" placeholder="产品名称" onchange="data.products[' + i + '].name=this.value">' +
          '<input class="form-input" value="' + esc(p.sub) + '" placeholder="产品描述" onchange="data.products[' + i + '].sub=this.value">' +
          '<input class="form-input" value="' + esc(p.price) + '" placeholder="价格" onchange="data.products[' + i + '].price=this.value">' +
          '<input class="form-input" value="' + esc(p.img) + '" placeholder="图片URL" onchange="data.products[' + i + '].img=this.value;renderProducts()">' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function esc(s) { return (s||'').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function addProduct() {
  data.products.push({name:"",sub:"",price:"",img:""});
  renderProducts();
  showToast('已添加新产品', 'success');
}

function removeProduct(i) {
  if (!confirm('确定删除？')) return;
  data.products.splice(i, 1);
  renderProducts();
  showToast('已删除', 'success');
}

function renderQA() {
  const list = document.getElementById('qaList');
  if (!data.qa || !data.qa.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">⚡</div><div class="empty-text">还没有快速入口</div></div>';
    return;
  }
  list.innerHTML = data.qa.map(function(q, i) {
    return '<div class="product-card">' +
      '<button class="remove-btn" onclick="removeQA(' + i + ')">×</button>' +
      '<div class="product-grid">' +
        '<div class="product-thumb">' + (q.img ? '<img src="' + q.img + '" onerror="this.parentElement.innerHTML=\'⚡\'">' : '⚡') + '</div>' +
        '<div class="product-fields">' +
          '<input class="form-input" value="' + esc(q.label) + '" placeholder="名称" onchange="data.qa[' + i + '].label=this.value">' +
          '<input class="form-input" value="' + esc(q.img) + '" placeholder="图片URL" onchange="data.qa[' + i + '].img=this.value;renderQA()">' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function addQA() {
  if (!data.qa) data.qa = [];
  data.qa.push({label:"",img:""});
  renderQA();
  showToast('已添加', 'success');
}

function removeQA(i) {
  if (!confirm('确定删除？')) return;
  data.qa.splice(i, 1);
  renderQA();
  showToast('已删除', 'success');
}

function saveAll() {
  data.heroTitle = document.getElementById('heroTitle').value;
  data.heroTag = document.getElementById('heroTag').value;
  data.heroDesc = document.getElementById('heroDesc').value;
  data.heroBtn = document.getElementById('heroBtn').value;
  data.heroImg = document.getElementById('heroImg').value;
  data.nlTitle = document.getElementById('nlTitle').value;
  data.nlDesc = document.getElementById('nlDesc').value;
  data.footerPhone = document.getElementById('footerPhone').value;
  data.footerCopy = document.getElementById('footerCopy').value;
  localStorage.setItem('givenchyData', JSON.stringify(data));
  showToast('✅ 所有更改已保存', 'success');
}

function exportData() {
  saveAll();
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'givenchy-data.json';
  a.click();
  showToast('📤 已导出备份文件', 'success');
}

function importData() {
  document.getElementById('importFile').click();
}

document.getElementById('importFile').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      data = JSON.parse(ev.target.result);
      localStorage.setItem('givenchyData', JSON.stringify(data));
      loadForm();
      showToast('📥 导入成功！', 'success');
    } catch(e) { showToast('❌ 文件格式错误', 'error'); }
  };
  reader.readAsText(file);
});

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + type + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

loadForm();
</script>
</body>
</html>
