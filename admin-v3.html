<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f9fc;--card:#fff;--border:#e5e7eb;--text:#111827;--text2:#6b7280;--text3:#9ca3af;--accent:#6366f1;--accent2:#4f46e5;--success:#10b981;--danger:#ef4444;--warn:#f59e0b;--radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);--shadow-lg:0 4px 6px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* Sidebar */
.sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:#fff;border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;z-index:100}
.sidebar-logo{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:8px 16px 20px;border-bottom:1px solid var(--border);margin-bottom:16px;color:var(--accent)}
.sidebar-nav{flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:#f3f4f6;color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.sidebar-foot{padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.sidebar-foot a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font-size:12px;color:var(--text3);transition:all .15s}
.sidebar-foot a:hover{background:#f3f4f6;color:var(--accent)}

/* Main */
.main{margin-left:240px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(248,249,252,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
.topbar-title{font-size:17px;font-weight:700}
.topbar-right{display:flex;gap:8px;align-items:center}
.btn{padding:9px 18px;border:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.25)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:8px}
.btn-danger-sm{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;padding:6px 12px;font-size:11px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600}
.btn-danger-sm:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.content{padding:28px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;background:#eef2ff;color:var(--accent)}

/* Form */
.fg{margin-bottom:16px}
.fl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:6px}
.fi{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);transition:all .15s}
.fi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.08);background:#fff}
textarea.fi{min-height:80px;resize:vertical}
.fh{font-size:11px;color:var(--text3);margin-top:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* Product/QA items */
.item-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;position:relative;transition:all .15s}
.item-card:hover{border-color:var(--accent)}
.item-card .rm{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:none;background:#fee2e2;color:var(--danger);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.item-card .rm:hover{background:var(--danger);color:#fff}
.item-grid{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:start}
.item-thumb{width:70px;height:70px;border-radius:10px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.item-thumb img{max-width:65%;max-height:65%;object-fit:contain}
.item-fields{display:flex;flex-direction:column;gap:6px}
.item-fields .fi{padding:7px 10px;font-size:12px}

/* Tab */
.tab{display:none}.tab.active{display:block}
.empty{text-align:center;padding:36px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-text{font-size:13px;margin-bottom:14px}

/* Toast */
.toast{position:fixed;top:20px;right:20px;padding:12px 22px;border-radius:12px;font-size:12px;font-weight:600;color:#fff;z-index:999;opacity:0;transform:translateY(-8px);transition:all .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.toast.show{opacity:1;transform:translateY(0)}
.toast-s{background:var(--success)}.toast-e{background:var(--danger)}

/* Link list */
.link-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.link-item:last-child{border:none}
.link-item input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px}
.link-item .rm-link{width:24px;height:24px;border-radius:50%;border:none;background:#fee2e2;color:var(--danger);font-size:13px;cursor:pointer;flex-shrink:0}

@media(max-width:900px){
  .sidebar{display:none}.main{margin-left:0}
  .content{padding:16px}.topbar{padding:12px 16px}
  .frow,.frow3{grid-template-columns:1fr}
  .item-grid{grid-template-columns:1fr}
  .item-thumb{width:100%;height:80px}
}
</style>
</head>

  document.querySelectorAll('.nav-item').forEach(function(x){x.classList.remove('active')});
  document.getElementById('tab-'+t).classList.add('active');
  el.classList.add('active');
  var m={banner:'顶部公告',hero:'Hero Banner',nav:'导航菜单',qa:'快速入口',products:'畅销商品',latest:'最新资讯',maison:'品牌故事',newsletter:'邮件订阅',footer:'Footer',social:'社交媒体'};
  document.getElementById('pageTitle').textContent=m[t]||t;
}

function rNav(){
  document.getElementById('navCount').textContent=data.navItems.length+' 项';
  var h='';for(var i=0;i<data.navItems.length;i++){var n=data.navItems[i];
    h+='<div class="link-item"><input value="'+esc(n.label)+'" placeholder="菜单名" onchange="data.navItems['+i+'].label=this.value"><input value="'+esc(n.href)+'" placeholder="链接" onchange="data.navItems['+i+'].href=this.value"><button class="rm-link" onclick="rmNav('+i+')">×</button></div>';}
  document.getElementById('navList').innerHTML=h;
}
function addNav(){data.navItems.push({label:'',href:'#'});rNav();}
function rmNav(i){data.navItems.splice(i,1);rNav();}

function rFooter(){
  ['products','service','about'].forEach(function(k){

    var h='';for(var i=0;i<data.footerLinks[k].length;i++){var l=data.footerLinks[k][i];
      h+='<div class="link-item"><input value="'+esc(l.label)+'" placeholder="名称" onchange="data.footerLinks.'+k+'['+i+'].label=this.value"><input value="'+esc(l.href)+'" placeholder="链接" onchange="data.footerLinks.'+k+'['+i+'].href=this.value"><button class="rm-link" onclick="rmFooterLink(\''+k+'\','+i+')">×</button></div>';}
    el.innerHTML=h;
  });
}

function exportData(){saveAll();var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='givenchy-data.json';a.click();toast('📤 已导出','s');}
function importData(){document.getElementById('importFile').click();}
document.getElementById('importFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{data=JSON.parse(ev.target.result);localStorage.setItem('gData',JSON.stringify(data));load();toast('📥 导入成功','s');}catch(e){toast('❌ 格式错误','e');}};r.readAsText(f);});
function toast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='toast toast-'+t+' show';setTimeout(function(){el.classList.remove('show');},2500);}

// GitHub Publish
var GH_TOKEN=localStorage.getItem('ghToken')||'';
var GH_REPO='kaynai1/givenchy-beauty';

function publishSite(){
  if(!GH_TOKEN){
    var tk=prompt('请输入你的 GitHub Token（ghp_ 开头）：');
    if(!tk)return;
    GH_TOKEN=tk;
    localStorage.setItem('ghToken',tk);
  }
  saveAll();
  toast('🚀 正在发布...','s');

  // Get current file SHA (needed for update)
  fetch('https://api.github.com/repos/'+GH_REPO+'/contents/index.html',{
    headers:{'Authorization':'token '+GH_TOKEN}
  })
  .then(function(r){return r.json();})
  .then(function(file){
    // Read local index.html to get template, then inject new data
    fetch('index.html').then(function(r){return r.text();}).then(function(html){
      // Replace CONFIG block with new data
      var dataStr=JSON.stringify(data,null,2);
      var newHtml=html.replace(/var CONFIG=\{[\s\S]*?\n\};/,'var CONFIG='+dataStr+';');
      
      var sha=file.sha;
      fetch('https://api.github.com/repos/'+GH_REPO+'/contents/index.html',{
        method:'PUT',
        headers:{'Authorization':'token '+GH_TOKEN,'Content-Type':'application/json'},
        body:JSON.stringify({
          message:'Update site content via admin',
          content:btoa(unescape(encodeURIComponent(newHtml))),
          sha:sha
        })
      })
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.content){
          toast('✅ 发布成功！1-2分钟生效','s');
        } else {
          toast('❌ 发布失败: '+(d.message||'未知错误'),'e');
        }
      })
      .catch(function(e){toast('❌ 网络错误','e');});
    });
  })
  .catch(function(e){toast('❌ 获取文件失败','e');});
}
